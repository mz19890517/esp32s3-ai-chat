name: Build Firmware

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build
        run: pio run
      - name: Merge flash image
        run: |
          python3 -c "
import pathlib
boot = pathlib.Path('.pio/build/esp32s3/bootloader.bin').read_bytes()
part = pathlib.Path('.pio/build/esp32s3/partitions.bin').read_bytes()
boot_app = pathlib.Path('.pio/build/esp32s3/boot_app0.bin').read_bytes()
firmware = pathlib.Path('.pio/build/esp32s3/firmware.bin').read_bytes()
pathlib.Path('merged_flash.bin').write_bytes(boot + part + boot_app + firmware)
"
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            .pio/build/esp32s3/firmware.bin
            merged_flash.bin
