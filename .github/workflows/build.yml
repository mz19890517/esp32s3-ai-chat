name: Build Firmware

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build
        run: pio run
      - name: Merge flash image
        run: |
          pip install "esptool<5"
          python -m esptool --chip esp32s3 merge-bin -o merged_flash.bin \
            --flash_mode qio --flash_freq 80m --flash_size 16MB \
            0x0 .pio/build/esp32s3/bootloader.bin \
            0x8000 .pio/build/esp32s3/partitions.bin \
            0xe000 .pio/build/esp32s3/boot_app0.bin \
            0x10000 .pio/build/esp32s3/firmware.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            .pio/build/esp32s3/firmware.bin
            merged_flash.bin
